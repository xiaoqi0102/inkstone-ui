version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 开发/构建依赖打成一个 PR，减少噪音
      dev-dependencies:
        dependency-type: development
      # 运行时依赖按 minor/patch 聚合，major 单独提
      runtime-minor:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # React 大版本升级需要人工评估（本库按 React 19 写）
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
